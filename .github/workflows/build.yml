name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact: dist-electron/Kitab-Setup-x64.exe
          - os: ubuntu-latest
            platform: linux
            artifact: dist-electron/Kitab-*
          - os: macos-latest
            platform: mac
            artifact: dist-electron/Kitab-mac-*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: electron-app/package-lock.json

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Install npm dependencies
        working-directory: electron-app
        run: npm ci

      # The .deb/.exe/.dmg version comes from package.json, so derive it from the
      # release tag. Otherwise every release ships as the same version and apt,
      # dmg and the Windows installer all report nothing newer.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: electron-app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "Tag $GITHUB_REF_NAME is not a semver version (e.g. v2.1.0)" >&2
            exit 1
          fi
          node -e '
            const fs = require("fs")
            const version = process.argv[1]
            for (const file of ["package.json", "package-lock.json"]) {
              const pkg = JSON.parse(fs.readFileSync(file, "utf8"))
              pkg.version = version
              if (pkg.packages && pkg.packages[""]) pkg.packages[""].version = version
              fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + "\n")
            }
          ' "$VERSION"
          echo "Packaging as version $(node -p 'require("./package.json").version')"

      - name: Build Vite renderer
        working-directory: electron-app
        run: npm run build

      - name: Package with electron-builder
        working-directory: electron-app
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitab-${{ matrix.platform }}
          path: electron-app/${{ matrix.artifact }}
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
